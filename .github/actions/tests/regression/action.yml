# .github/actions/tests/regression/action.yml
name: PXF Regression
description: Builds and runs PXF regression tests inside Docker

inputs:
  version:
    required: true
    description: 'GGDB major version (e.g., 6 or 7)'
  release:
    required: true
    description: 'Artifacts suffixs (e.g., prod or devel)'
  target_os:
    description: 'Target OS (e.g., ubuntu)'
    required: true
  target_os_version:
    description: 'Target OS version (e.g., 22.04)'
    required: true

runs:
  using: composite
  steps:
    - name: Build PXF regression image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./ci/Dockerfile.regression
        push: false
        tags: ggdb${{ inputs.version}}_${{ inputs.target_os}}${{ inputs.target_os_version }}_pxf_regression_${{ inputs.release }}
        build-args: |
          GGDB_IMAGE=ggdb${{ inputs.version}}_${{ inputs.target_os}}${{ inputs.target_os_version != '22.04' && inputs.target_os_version || '' }}:latest

    - name: Run regression
      shell: bash
      run: |
        mkdir logs
        docker run --user root:root \
          -v ./logs:/logs \
          --sysctl 'kernel.sem=500 1024000 200 4096' \
          --privileged \
          ggdb${{ inputs.version}}_${{ inputs.target_os}}${{ inputs.target_os_version }}_pxf_regression_${{ inputs.release }} \
          bash -c "
            set +e
            cd /tmp/build || status=1
            pxf_src/ci/test_in_docker.sh
            status=\$?
            find /tmp/build/pxf_src/fdw -type f -name *.diffs -exec mv -f {} /logs \;
            echo \">>> STATUS \$status\"
            exit \${status:-1}
          "

    - name: Upload regression artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: regression-ggdb${{ inputs.version}}_${{ inputs.target_os}}${{ inputs.target_os_version }}-${{ inputs.release }}
        path: logs
        retention-days: 7
        if-no-files-found: warn
