# .github/workflows/greengage-reusable-tests-integration-bundle.yml
name: Greengage PXF Reusable Integration tests BUNDLE

on:
  workflow_call:
    inputs:
      builds:
        required: true
        type: string  # JSON string with builds matrix
      tests:
        required: true
        type: string  # JSON string with tests matrix

jobs:
  integration:
    name: Integration with ${{ matrix.release }} ggdb${{ matrix.version }} on ${{ matrix.target_os }} ${{ matrix.target_os_version }} 
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.builds) }}

    uses: ./.github/workflows/greengage-reusable-tests-integration.yml
    with:
      tag:     ${{ matrix.tag }}
      version: ${{ matrix.version }}
      release: ${{ matrix.release }}
      target_os: ${{ matrix.target_os }}
      target_os_version: ${{ matrix.target_os_version }}
      tests: ${{ inputs.tests }}
