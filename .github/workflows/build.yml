# .github/workflows/build.yml
name: Build PXF Components

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']
    tags: ['6.*']

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            cache_paths: |
              server/build/stage
            setup: java
            build_command: ./gradlew stage
          - component: cli
            cache_paths: |
              cli/build
            setup: go
            build_command: make build
          - component: fdw
            cache_paths: |
              fdw/*.so
              fdw/*.sql
              fdw/*.control
            setup: c
            build_command: make
          - component: external-table
            cache_paths: |
              external-table/*.so
              external-table/*.sql
            setup: c
            build_command: make
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.setup == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Go
        if: matrix.setup == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Install C dependencies
        if: matrix.setup == 'c'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake

      - name: Build ${{ matrix.component }}
        run: |
          cd ${{ matrix.component }} || exit 1
          ${{ matrix.build_command }}

      - name: Cache artifacts
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: pxf-${{ matrix.component }}-${{ github.sha }}
