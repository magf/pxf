# .github/workflows/greengage-ci.yml
name: Greengage PXF CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
    tags: ['**']   # Trigger on tags for versioned releases
  pull_request:
    branches: ['**'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  BUILD_MATRIX: |
    [
      { "version": "6", "target_os": "ubuntu", "target_os_version": "22.04", "release": "prod"  },
      { "version": "6", "target_os": "ubuntu", "target_os_version": "22.04", "release": "devel" },
      { "version": "6", "target_os": "ubuntu", "target_os_version": "24.04", "release": "prod"  },
      { "version": "6", "target_os": "ubuntu", "target_os_version": "24.04", "release": "devel" },
      { "version": "7", "target_os": "ubuntu", "target_os_version": "22.04", "release": "prod"  },
      { "version": "7", "target_os": "ubuntu", "target_os_version": "22.04", "release": "devel" }
    ]
  TESTS: |
    [
      { "test": "smoke" },
      { "test": "gpdb" },
      { "test": "jdbc" },
      { "test": "smoke",   "fdw": "true" },
      { "test": "gpdb",    "fdw": "true" },
      { "test": "jdbc",    "fdw": "true" },
      { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
    ]

jobs:
  generate-matrix:
    name: Generate CI matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.builds.outputs.matrix }}
      tests:  ${{ steps.tests.outputs.tests }}
    steps:
      - name: Generate builds mtrix
        id: builds
        run: |
          cat > /tmp/builds.json << 'JSON_END'
          ${{ env.BUILD_MATRIX }}
          JSON_END
          echo "matrix=$(jq -c . /tmp/builds.json)" >> $GITHUB_OUTPUT

      - name: Generate tests mtrix
        id: tests
        run: |
          cat > /tmp/tests.json << 'JSON_END'
          ${{ env.TESTS }}
          JSON_END
          echo "tests=$(jq -c . /tmp/tests.json)" >> $GITHUB_OUTPUT

  build-deb:
    needs: generate-matrix
    name: Build deb-packages on ${{ matrix.target_os }}:${{ matrix.target_os_version }} with ggdb${{ matrix.version }}
    runs-on: ubuntu-latest
    env:
      GGDB_IMAGE:   ${{ matrix.release == 'devel' && 'ghcr.io/greengagedb/greengage' || 'greengagedb' }}/ggdb${{ matrix.version}}_${{ matrix.target_os}}${{ matrix.target_os_version != '22.04' && matrix.target_os_version || '' }}:latest
      DEB_PACKAGES: deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}${{ matrix.release == 'devel' && '-devel' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.builds) }}

    steps:
      - uses: actions/checkout@v6
      - name: Build in Docker using docker run
        env:
          GOPATH:   /opt/go
          DEV_HOME: /home/gpadmin
          PXF_HOME: /opt/greengagedb/pxf
          GPHOME:   /opt/greengagedb/greengage${{ matrix.version }}
          PXF_SRC:  /home/gpadmin/pxf
          PATH:     /opt/greengagedb/greengage${{ matrix.version }}/bin:/opt/greengagedb/pxf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:/opt/go/bin
          DEBIAN_FRONTEND:   noninteractive
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
          GREENGAGE_VERSION: ${{ matrix.version }}

        run: |
          set -eux
          docker run \
            --rm \
            -v ${{ github.workspace }}:$PXF_SRC \
            -w $PXF_SRC \
            -e DEV_HOME \
            -e PXF_HOME \
            -e GPHOME \
            -e GOPATH \
            -e PXF_SRC \
            -e PATH \
            -e DEBIAN_FRONTEND \
            -e JAVA_TOOL_OPTIONS \
            -e GREENGAGE_VERSION \
            $GGDB_IMAGE \
            /bin/bash ci/build_in_docker.sh

          mv Package $DEB_PACKAGES

      - name: Upload Package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_PACKAGES }}
          path: ${{ env.DEB_PACKAGES }}

      - name: Test install deb-packages in Docker 
        uses: greengagedb/greengage-ci/.github/actions/tests/install/deb@v44
        with:
          test_docker: ${{ matrix.target_os}}:${{ matrix.target_os_version }}
          artifact_name: ${{ env.DEB_PACKAGES }}
          verify_commands: |
            dpkg -l greengage* 2>/dev/null || true
            dpkg -l pxf*

  regression:
    if: github.event_name == 'pull_request'  # Only for PR
    needs: generate-matrix
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/tests/regression@CI-5860
        with:
          version: ${{ matrix.version }}
          release: ${{ matrix.release }}
          target_os: ${{ matrix.target_os }}
          target_os_version: ${{ matrix.target_os_version }}

  integration:
    if: github.event_name == 'pull_request'  # Only for PR
    needs: generate-matrix
    name: Integration on ${{ matrix.target_os }}${{ matrix.target_os_version }} for ggdb${{ matrix.version }}${{ matrix.release == 'devel' && '-devel' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.builds) }}
    uses: ./.github/workflows/greengage-reusable-tests-integration.yml
    with:
      version: ${{ matrix.version }}
      release: ${{ matrix.release }}
      target_os: ${{ matrix.target_os }}
      target_os_version: ${{ matrix.target_os_version }}
      tests: ${{ needs.generate-matrix.outputs.tests }}
