# .github/workflows/greengage-ci.yml
name: CI Pipeline

on:
  pull_request:
    branches: ['*']

env:
  PXF_HOME: /usr/local/pxf
  GPHOME:   /usr/local/greengage-db-devel

jobs:
  build:
    # The matrix defines the container image and its home directory
    strategy:
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
          # Add more OS images later if needed:
          # - image: greengagedb/ggdb6_centos:6.29.1
          #   dev_home: /home/gpadmin

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      volumes:
        - ${{ github.workspace }}:${{ matrix.dev_home }}/pxf
      env:
        PXF_HOME: ${{ env.PXF_HOME }}
        DEV_HOME: ${{ matrix.dev_home }}
        GPHOME:   ${{ env.GPHOME }}
        PATH:     ${{ env.PXF_HOME }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies (Java + Go)
        run: |
          set -eux
          apt-get update
          apt-get install -y openjdk-17-jdk
          java -version
          go_version=$(grep -E '^go [0-9]+\.[0-9]+\.[0-9]+' cli/go.mod | cut -d' ' -f2)
          curl -L https://go.dev/dl/go$go_version.linux-amd64.tar.gz -O go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf go.tar.gz
          go version

      - name: Build and install all components
        working-directory: ${{ matrix.dev_home }}/pxf
        shell: bash
        run: |
          set -x
          ls -la $DEV_HOME
          mkdir -p $GPHOME
          tar -xzf $DEV_HOME/bin_gpdb/bin_gpdb.tar.gz -C $GPHOME/
          ls -la $GPHOME/
          source $GPHOME/greengage_path.sh
          make all install

      - name: Cache installed PXF
        uses: actions/cache@v4
        with:
          path: ${{ env.PXF_HOME }}
          key: pxf-${{ github.sha }}

      - name: Upload installed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxf-bin
          path: ${{ env.PXF_HOME }}

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            group: smoke
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            group: features
          - image: greengagedb/ggdb6_ubuntu:6.29.1
            dev_home: /home/gpadmin
            group: regression
    container:
      image: ${{ matrix.image }}
      options: --privileged --user root
      volumes:
        - ${{ github.workspace }}:${{ matrix.dev_home }}/pxf
      env:
        PXF_HOME: ${{ env.PXF_HOME }}
        DEV_HOME: ${{ matrix.dev_home }}
        GPHOME:   ${{ env.GPHOME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore PXF installation
        uses: actions/cache@v4
        with:
          path: ${{ env.PXF_HOME }}
          key: pxf-${{ github.sha }}

      - name: Start Hadoop services for ${{ matrix.group }}
        uses: isbang/compose-action@v2.1.1
        with:
          compose-file: "${{ matrix.dev_home }}/pxf/automation/env/docker-compose-ssl.yml"
          project-name: "pxf-test-${{ matrix.group }}"

      - name: Run ${{ matrix.group }} tests
        working-directory: ${{ matrix.dev_home }}/pxf/automation
        shell: bash
        run: |
          export PATH="$PXF_HOME/bin:$PATH"
          source $GPHOME/greengage_path.sh
          pxf prepare
          pxf start
          make GROUP=${{ matrix.group }}
