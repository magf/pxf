# .github/workflows/greengage-ci.yml
name: CI Pipeline

on:
  pull_request:
    branches: ['*']

env:
  PXF_HOME: /usr/local/pxf
  DEV_HOME: /home/gpadmin
  GPHOME:   /usr/local/greengage-db-devel

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: greengagedb/ggdb6_ubuntu:6.29.1
      volumes:
        - ${{ github.workspace }}:${{ vars.DEV_HOME }}/pxf
      env:
        PXF_HOME: ${{ vars.PXF_HOME }}
        DEV_HOME: ${{ vars.DEV_HOME }}
        GPHOME:   ${{ vars.GPHOME }}
        PATH:     ${{ vars.PXF_HOME }}/bin:$PATH
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache-dependency-path: cli

      # - name: Build and install all components
      #   run: |
      #     sudo bash -c "
      #       set -x
      #       pwd
      #       ls -la 
      #       ls -la /home
      #       mkdir -p $GPHOME
      #       tar -xzf $DEV_HOME/bin_gpdb/bin_gpdb.tar.gz -C $GPHOME/
      #       source $GPHOME/greengage_path.sh
      #       make all install
      #     "

      - name: Debug container
        run: |
          set -x
          echo "Hostname:" $(hostname)
          cat /etc/os-release
          ps -ef | head
          id

      - name: Cache installed PXF
        uses: actions/cache@v4
        with:
          path: ${{ vars.PXF_HOME }}
          key: pxf-${{ github.sha }}

      - name: Upload installed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxf-bin
          path: ${{ vars.PXF_HOME }}

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [smoke, features, regression]
    container:
      image: greengagedb/ggdb6_ubuntu:6.29.1
      options: --privileged --user root
      volumes:
        - ${{ github.workspace }}:${{ vars.DEV_HOME }}/pxf
      env:
        PXF_HOME: ${{ vars.PXF_HOME }}
        GPHOME:   ${{ vars.GPHOME }}
        PATH:     ${{ vars.PXF_HOME }}/bin:$PATH
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore PXF installation
        uses: actions/cache@v4
        with:
          path: ${{ vars.PXF_HOME }}
          key: pxf-${{ github.sha }}

      - name: Start Hadoop services for ${{ matrix.group }}
        uses: isbang/compose-action@v2.1.1
        with:
          compose-file: "${{ vars.DEV_HOME }}/pxf/automation/env/docker-compose-ssl.yml"
          project-name: "pxf-test-${{ matrix.group }}"

      - name: Run ${{ matrix.group }} tests
        working-directory: ${{ vars.DEV_HOME }}/pxf/automation
        run: |
          source $GPHOME/greengage_path.sh
          pxf prepare
          pxf start
          make GROUP=${{ matrix.group }}
