# .github/workflows/greengage-ci.yml
name: Greengage PXF CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
    tags: ['**']   # Trigger on tags for versioned releases
  pull_request:
    branches: ['**'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

env:
  IMAGES: |
    [
      { "version": "6", "image": "greengagedb/ggdb", "tag": "6.31.0"  },
      { "version": "7", "image": "greengagedb/ggdb", "tag": "7.4.1"   },
      { "version": "6", "image": "ghcr.io/greengagedb/greengage/ggdb", "tag": "latest" },
      { "version": "7", "image": "ghcr.io/greengagedb/greengage/ggdb", "tag": "latest" }
    ]
  TESTS: |
    [
      { "test": "smoke" },
      { "test": "gpdb" },
      { "test": "jdbc" },
      { "test": "smoke",   "fdw": "true" },
      { "test": "gpdb",    "fdw": "true" },
      { "test": "jdbc",    "fdw": "true" },
      { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
    ]

jobs:
  build:
    name: Build on ${{ matrix.target_os }}:${{ matrix.target_os_version }} with ggdb${{ matrix.version }}${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # With STABLE GG6
          - version: 6 # greengagedb/ggdb6_ubuntu:6.31.0
            target_os: ubuntu
            target_os_version: 22.04
          - version: 6 # greengagedb/ggdb6_ubuntu24.04:6.31.0
            target_os: ubuntu
            target_os_version: 24.04

          # With DEVEL GG6
          - version: 6 # image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
            target_os: ubuntu
            target_os_version: 22.04
            release: -devel
          - version: 6 # image: ghcr.io/greengagedb/greengage/ggdb624.04_ubuntu:latest
            target_os: ubuntu
            target_os_version: 24.04
            release: -devel

          # # With STABLE GG7
          # - version: 7 # image: greengagedb/ggdb7_ubuntu:7.4.1
          #   target_os: ubuntu
          #   target_os_version: 22.04

          # # With DEVEL GG7
          # - version: 7 # image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu:latest
          #   target_os: ubuntu
          #   target_os_version: 22.04
          #   release: -devel

    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker using docker run
        env:
          DEV_HOME: /home/gpadmin
          PXF_HOME: /opt/greengagedb/greengage/pxf
          GPHOME: /opt/greengagedb/greengage
          GOPATH: /opt/go
          PXF_SRC: /home/gpadmin/pxf
          PATH: /opt/greengagedb/greengage/bin:/opt/greengagedb/greengage/pxf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:/opt/go/bin
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
          DEBIAN_FRONTEND: noninteractive
          GREENGAGE_VERSION: ${{ matrix.version }}
          GREENGAGE_PACKAGE: greengage${{ matrix.version }}
          GREENGAGE_REPO_URL: 'https://greengagedb.org' # 'https://storage.yandexcloud.net/greengage-repo'
          IMAGE: ${{ matrix.release == '-devel' && 'ghcr.io/greengagedb/greengage' || 'greengagedb' }}/ggdb${{ matrix.version}}_${{ matrix.target_os}}${{ matrix.target_os_version != '22.04' && matrix.target_os_version || '' }}:latest

        run: |
          set -eu
          docker run \
            --rm \
            -v ${{ github.workspace }}:$PXF_SRC \
            -w $PXF_SRC \
            -e DEV_HOME \
            -e PXF_HOME \
            -e GPHOME \
            -e GOPATH \
            -e PXF_SRC \
            -e PATH \
            -e JAVA_TOOL_OPTIONS \
            -e DEBIAN_FRONTEND \
            -e GREENGAGE_VERSION \
            -e GREENGAGE_PACKAGE \
            -e GREENGAGE_REPO_URL \
            $IMAGE \
            /bin/bash ci/build_in_docker.sh

      - name: Rename Package artifacts
        run: mv Package deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}

      - name: Upload Package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}
          path: deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}

      - name: Test install deb-package in Docker 
        uses: greengagedb/greengage-ci/.github/actions/tests/install/deb@v44
        with:
          test_docker: ${{ matrix.target_os}}:${{ matrix.target_os_version }}
          artifact_name: deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}
          verify_commands: |
            dpkg -l greengage* 2>/dev/null || true
            dpkg -l pxf*

  generate-matrix:
    name: Generate CI matrix
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      tests:  ${{ steps.tests.outputs.tests }}
    steps:
      - name: Generate images mtrix
        id: images
        run: |
          cat > /tmp/images.json << 'JSON_END'
          ${{ env.IMAGES }}
          JSON_END
          echo "matrix=$(jq -c . /tmp/images.json)" >> $GITHUB_OUTPUT

      - name: Generate tests mtrix
        id: tests
        run: |
          cat > /tmp/tests.json << 'JSON_END'
          ${{ env.TESTS }}
          JSON_END
          echo "tests=$(jq -c . /tmp/tests.json)" >> $GITHUB_OUTPUT

  regression:
    if: github.event_name == 'pull_request'  # Only for PR
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tests/regression
        with:
          tag:     ${{ matrix.tag }}
          image:   ${{ matrix.image }}
          version: ${{ matrix.version }}

  integration-0:
    if: github.event_name == 'pull_request'  # Only for PR
    needs: generate-matrix
    name: Integration on ggdb${{ fromJson(needs.generate-matrix.outputs.images)[0].version }}:${{ fromJson(needs.generate-matrix.outputs.images)[0].tag }}
    uses: ./.github/workflows/greengage-reusable-tests-integration.yml
    with:
      tag:     ${{ fromJson(needs.generate-matrix.outputs.images)[0].tag }}
      image:   ${{ fromJson(needs.generate-matrix.outputs.images)[0].image }}
      version: ${{ fromJson(needs.generate-matrix.outputs.images)[0].version }}
      tests: ${{ needs.generate-matrix.outputs.tests }}

  integration-1:
    if: github.event_name == 'pull_request'  # Only for PR
    needs: generate-matrix
    name: Integration on ggdb${{ fromJson(needs.generate-matrix.outputs.images)[1].version }}:${{ fromJson(needs.generate-matrix.outputs.images)[1].tag }}
    uses: ./.github/workflows/greengage-reusable-tests-integration.yml
    with:
      tag:     ${{ fromJson(needs.generate-matrix.outputs.images)[1].tag }}
      image:   ${{ fromJson(needs.generate-matrix.outputs.images)[1].image }}
      version: ${{ fromJson(needs.generate-matrix.outputs.images)[1].version }}
      tests: ${{ needs.generate-matrix.outputs.tests }}

  integration-2:
    if: github.event_name == 'pull_request'  # Only for PR
    needs: generate-matrix
    name: Integration on ggdb${{ fromJson(needs.generate-matrix.outputs.images)[2].version }}:${{ fromJson(needs.generate-matrix.outputs.images)[2].tag }}
    uses: ./.github/workflows/greengage-reusable-tests-integration.yml
    with:
      tag:     ${{ fromJson(needs.generate-matrix.outputs.images)[2].tag }}
      image:   ${{ fromJson(needs.generate-matrix.outputs.images)[2].image }}
      version: ${{ fromJson(needs.generate-matrix.outputs.images)[2].version }}
      tests: ${{ needs.generate-matrix.outputs.tests }}

  integration-3:
    if: github.event_name == 'pull_request'  # Only for PR
    needs: generate-matrix
    name: Integration on ggdb${{ fromJson(needs.generate-matrix.outputs.images)[3].version }}:${{ fromJson(needs.generate-matrix.outputs.images)[3].tag }}
    uses: ./.github/workflows/greengage-reusable-tests-integration.yml
    with:
      tag:     ${{ fromJson(needs.generate-matrix.outputs.images)[3].tag }}
      image:   ${{ fromJson(needs.generate-matrix.outputs.images)[3].image }}
      version: ${{ fromJson(needs.generate-matrix.outputs.images)[3].version }}
      tests: ${{ needs.generate-matrix.outputs.tests }}
