# Main CI pipeline orchestrating build, test, and upload stages
name: Greengage CI

on:
  push:
    branches: ['main']  # Trigger on push to main (after merged PR)
    tags: ['**']   # Trigger on tags for versioned releases
  pull_request:
    branches: ['**'] # Trigger on pull requests for all branches

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

jobs:
  build:
    name: Build on ggdb${{ matrix.version }}${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # With STABLE GG6
          - tag: 6.31.0 # greengagedb/ggdb6_ubuntu:6.31.0
            version: '6'
            target_os: ubuntu
            target_os_version: "22.04"
          - tag: 6.31.0 # greengagedb/ggdb6_ubuntu24.04:6.31.0
            version: '6'
            target_os: ubuntu
            target_os_version: "24.04"

          # With DEVEL GG6
          - tag: latest # image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu:latest
            release: '-devel'
            version: '6'
            target_os: ubuntu
            target_os_version: "22.04"
          - tag: latest # image: ghcr.io/greengagedb/greengage/ggdb624.04_ubuntu:latest
            release: '-devel'
            version: '6'
            target_os: ubuntu
            target_os_version: "24.04"

          # With STABLE GG7
          - tag: 7.4.0 # greengagedb/ggdb7_ubuntu:7.4.0
            version: '7'
            target_os: ubuntu
            target_os_version: "22.04"
          - tag: 7.4.0 # greengagedb/ggdb7_ubuntu24.04:7.4.0
            version: '7'
            target_os: ubuntu
            target_os_version: "24.04"

          # With DEVEL GG7
          - tag: latest # ghcr.io/greengagedb/greengage/ggdb7_ubuntu:latest
            release: '-devel'
            version: '7'
            target_os: ubuntu
            target_os_version: "22.04"
          - tag: latest # ghcr.io/greengagedb/greengage/ggdb7_ubuntu24.04:latest
            release: '-devel'
            version: '7'
            target_os: ubuntu
            target_os_version: "24.04"

    env:
      GREENGAGE_DEB:     Package/greengage.deb
      GREENGAGE_DEB_URL: https://github.com/GreengageDB/greengage/releases/download/6.29.2/greengage6.deb
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker using docker run
        env:
          DEV_HOME: /home/gpadmin
          PXF_HOME: /opt/greengagedb/greengage/pxf
          GPHOME: /opt/greengagedb/greengage
          GOPATH: /opt/go
          PXF_SRC: /home/gpadmin/pxf
          PATH: /opt/greengagedb/greengage/bin:/opt/greengagedb/greengage/pxf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:/opt/go/bin
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
          DEBIAN_FRONTEND: noninteractive
          GREENGAGE_DEB: ${{ env.GREENGAGE_DEB }}
          GREENGAGE_DEB_URL: ${{ env.GREENGAGE_DEB_URL }}
          IMAGE: ${{ matrix.release == '-devel' && 'ghcr.io/greengagedb/greengage' || 'greengagedb' }}/ggdb${{ matrix.version}}_${{ matrix.target_os}}${{ matrix.target_os_version != '22.04' && matrix.target_os_version || '' }}:${{ matrix.tag }}
        run: |
          set -eu
          mkdir -p "$(dirname $GREENGAGE_DEB)"
          curl -L $GREENGAGE_DEB_URL -o $GREENGAGE_DEB
          docker run \
            --rm \
            -v ${{ github.workspace }}:$PXF_SRC \
            -w $PXF_SRC \
            -e DEV_HOME \
            -e PXF_HOME \
            -e GPHOME \
            -e GOPATH \
            -e PXF_SRC \
            -e PATH \
            -e JAVA_TOOL_OPTIONS \
            -e DEBIAN_FRONTEND \
            -e GREENGAGE_DEB \
            -e GREENGAGE_DEB_URL \
            $IMAGE \
            /bin/bash ci/build_in_docker.sh

      - name: Rename Package artifacts
        run: mv Package deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}

      - name: Upload Package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}
          path: deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}

      - name: Test install deb-package in Docker 
        uses: greengagedb/greengage-ci/.github/actions/tests/install/deb@v44
        with:
          test_docker: ${{ matrix.target_os}}:${{ matrix.target_os_version }}
          artifact_name: deb-packages-pxf${{ matrix.version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}
          verify_commands: |
            dpkg -l sigar 2>/dev/null || true
            dpkg -l greengage*


  regression:
    if: github.event_name == 'pull_request'  # Only for PR
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: greengagedb/ggdb6_ubuntu:6.31.0
            release: stable
            version: '6'
          - image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
            release: devel
            version: '6'
          - image: greengagedb/ggdb7_ubuntu:7.4.0
            release: stable
            version: '7'
          - image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
            release: devel
            version: '7'

    steps:
      - uses: actions/checkout@v4
      - name: Build PXF regression on ggdb${{ matrix.version }}-${{ matrix.release }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.${{ github.job }}
          push: false
          tags: greengagedb/ggdb${{ matrix.version }}_pxf_regression:${{ matrix.release }}
          build-args: GGDB_IMAGE=${{ matrix.image }}

      - name: Run regression on ggdb${{ matrix.version }}-${{ matrix.release }}
        shell: bash
        run: |
          mkdir logs
          docker run --user root:root \
            -v ./logs:/logs \
            --sysctl 'kernel.sem=500 1024000 200 4096' \
            --privileged \
            greengagedb/ggdb${{ matrix.version }}_pxf_regression:${{ matrix.release }} \
            bash -c "
              set +e
              cd /tmp/build || status=1
              pxf_src/ci/test_in_docker.sh
              status=\$?
              find /tmp/build/pxf_src/fdw -type f -name *.diffs -exec mv -f {} /logs \;
              echo \">>> STATUS \$status\"
              exit \${status:-1}
            "

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-ggdb${{ matrix.version }}-${{ matrix.release }}
          path: logs
          retention-days: 7
          if-no-files-found: warn

  integration-ggdb6-stable:
    if: github.event_name == 'pull_request'  # Only for PR
    name: Integration on ggdb6-stable
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb6_ubuntu:6.31.0
      version: '6'
      release: stable
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb6-devel:
    if: github.event_name == 'pull_request'  # Only for PR
    name: Integration on ggdb6-devel
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: ghcr.io/greengagedb/greengage/ggdb6_ubuntu
      version: '6'
      release: devel
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb7-stable:
    if: github.event_name == 'pull_request'  # Only for PR
    name: Integration on ggdb7-stable
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: greengagedb/ggdb7_ubuntu:7.4.0
      version: '7'
      release: stable
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]

  integration-ggdb7-devel:
    if: github.event_name == 'pull_request'  # Only for PR
    name: Integration on ggdb7-devel
    uses: ./.github/workflows/integration-tests.yml
    with:
      image: ghcr.io/greengagedb/greengage/ggdb7_ubuntu
      version: '7'
      release: devel
      tests_matrix: |
        [
          { "test": "smoke" },
          { "test": "gpdb" },
          { "test": "jdbc" },
          { "test": "smoke", "fdw": "true" },
          { "test": "gpdb", "fdw": "true" },
          { "test": "jdbc", "fdw": "true" },
          { "test": "ggdbssl", "fdw": "true", "ssl": "true" }
        ]
