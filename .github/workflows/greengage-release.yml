# Release creation workflow
name: Greengage release

on:
  release:
    types: [published, edited]

concurrency:
  group: Greengage CI-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload-to-release:
    strategy:
      fail-fast: false
      matrix:
        version: # as package suffix
        - '6-devel'
        - '7-devel'
        - '6-stable'
        - '7-stable'

    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read 
    steps:
      - name: Upload packages to release
        uses: greengagedb/greengage-ci/.github/actions/upload-pkgs-to-release@main
        with:
          version: -${{ matrix.version }}
          artifact_name: pxf-packages-${{ matrix.version }}
          package_name: pxf
          extensions: deb ddeb
