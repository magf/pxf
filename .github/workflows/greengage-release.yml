# .github/workflows/greengage-release.yml
name: Greengage PXF Release

on:
  release:
    types: [released]

jobs:
  upload-to-release:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target_os: ubuntu
          target_os_version: '22.04'
          extensions:  deb ddeb
          package_dir: deb-packages-pxf6
        - target_os: ubuntu
          target_os_version: '24.04'
          extensions:  deb ddeb
          package_dir: deb-packages-pxf6
        # - target_os: ubuntu
        #   target_os_version: '22.04'
        #   extensions:  deb ddeb
        #   package_dir: deb-packages-pxf7
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Upload packages to release
        uses: greengagedb/greengage-ci/.github/actions/upload-pkgs-to-release@v39
        with:
          workflow_for_waiting: Greengage PXF CI
          extensions:           ${{ matrix.extensions }}
          package_dir:          ${{ matrix.package_dir }}
          target_os:            ${{ matrix.target_os }}
          target_os_version:    ${{ matrix.target_os_version }}
