# Release creation workflow
name: Greengage release info

on:
  release:
    types: [published, edited]

jobs:
  info:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show release info
        run: |
          echo "Tag: ${{ github.event.release.tag_name }}"
          echo "Release name: ${{ github.event.release.name }}"
          echo "Is draft: ${{ github.event.release.draft }}"
          echo "Is prerelease: ${{ github.event.release.prerelease }}"
          echo "Target commitish: ${{ github.event.release.target_commitish }}"
          echo "Created at: ${{ github.event.release.created_at }}"
          echo "Published at: ${{ github.event.release.published_at }}"

      - name: Show workflow context
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Run attempt: ${{ github.run_attempt }}"

      - name: Get CI workflow runs for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow "Greengage CI" --limit 50 \
            --json conclusion,headSha,event,headBranch,databaseId,url,displayTitle,createdAt,updatedAt \
            --jq 'map(select(.headSha == "'"${{ github.sha }}"'" or .headBranch == "'"${{ github.event.release.tag_name }}"'"))')
          
          echo "Found $(echo "$runs" | jq 'length') runs"
          echo "$runs" | jq -c '.[]' | while read run; do
            echo "$run" | jq -r '. | "ID: \(.databaseId) Conclusion: \(.conclusion) SHA: \(.headSha) Branch/Tag: \(.headBranch) Event: \(.event)"'
          done

      - name: Check available caches BUILTIN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matrix_combinations=(
            "pxf-packages-6-devel"
            "pxf-packages-6-stable"
            "pxf-packages-7-devel"
            "pxf-packages-7-stable"
            "deb-packages"
            "pxf-packages"
            "Packages"
          )
          
          for prefix in "${matrix_combinations[@]}"; do
            key="${prefix}-${{ github.sha }}"
            cache_info=$(gh cache list --key "$key" 2>/dev/null || true)
            if [ -n "$cache_info" ] && [ "$cache_info" != "[]" ]; then
              echo "Cache found: $key"
            else
              echo "Cache not found: $key"
            fi
          done

      - name: Check artifacts for successful CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh run list --workflow "Greengage CI" --limit 20 --json databaseId,conclusion,headSha,headBranch \
            --jq 'map(select(.conclusion == "success"))')
          
          echo "Found $(echo "$successful_runs" | jq 'length') successful runs"
          
          echo "$successful_runs" | jq -c '.[]' | while read run; do
            run_id=$(echo "$run" | jq -r '.databaseId')
            sha=$(echo "$run" | jq -r '.headSha')
            branch=$(echo "$run" | jq -r '.headBranch')
            
            echo "Run $run_id (SHA: $sha, Branch: $branch)"
            
            artifacts=$(gh api /repos/${{ github.repository }}/actions/runs/$run_id/artifacts 2>/dev/null || echo '{"artifacts": []}')
            artifact_count=$(echo "$artifacts" | jq '.artifacts | length')
            
            if [ "$artifact_count" -gt 0 ]; then
              echo "$artifacts" | jq -r '.artifacts[] | "  - \(.name) (\(.id)): \(.size_in_bytes) bytes"'
            else
              echo "No artifacts"
            fi
          done
